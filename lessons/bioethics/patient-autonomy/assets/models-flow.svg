<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" shape-rendering="crispEdges" role="img" aria-label="Decision flowchart for Emanuel and Emanuel's four models of the doctor-patient relationship. Depending on the clinical urgency and the patient's values, four distinct models apply: 1. In emergencies with incapacity, the Paternalistic model positions the doctor as a guardian where the patient assents. 2. When patient values are fixed and known, the Informative model positions the doctor as a technician who provides facts while the patient chooses alone. 3. When patient values are unclear or conflicted, the Interpretive model positions the doctor as a counselor to clarify existing values. 4. When health values are open to dialogue and growth, the Deliberative model (the Emanuels' ideal) positions the doctor as a teacher and friend who engages in persuasion without coercion.">
  <rect width="640" height="250" fill="#1a1f31"/>
  <g font-family="Verdana, DejaVu Sans, sans-serif" text-anchor="middle">

    <!-- Header / Root Question -->
    <rect x="14" y="12" width="612" height="36" fill="#3a3418" stroke="#ffcf5a" stroke-width="3"/>
    <text x="320" y="35" fill="#ffcf5a" font-size="14" font-weight="bold">Clinical Choice: How should the doctor engage the patient's values?</text>

    <!-- Branch Lines from Root -->
    <g stroke="#9aa3c7" stroke-width="3" fill="none">
      <path d="M88 48 L88 66"/>
      <path d="M242 48 L242 66"/>
      <path d="M398 48 L398 66"/>
      <path d="M552 48 L552 66"/>
    </g>

    <!-- Column 1: Paternalistic -->
    <rect x="14" y="66" width="148" height="44" fill="#2d1c24" stroke="#ff6a6a" stroke-width="3"/>
    <text x="88" y="85" fill="#ff6a6a" font-size="12" font-weight="bold">Emergency / Crisis</text>
    <text x="88" y="101" fill="#e8a2a8" font-size="10.5">patient incapacitated</text>

    <path d="M88 110 L88 126" stroke="#ff6a6a" stroke-width="3" fill="none"/>
    <path d="M83 120 L88 128 L93 120 Z" fill="#ff6a6a"/>

    <rect x="14" y="128" width="148" height="76" fill="#232838" stroke="#ff6a6a" stroke-width="3"/>
    <text x="88" y="149" fill="#ff6a6a" font-size="14" font-weight="bold">Paternalistic</text>
    <text x="88" y="167" fill="#eef1ff" font-size="11.5">Doctor as Guardian</text>
    <text x="88" y="184" fill="#9aa3c7" font-size="10.5">Patient assents</text>
    <text x="88" y="196" fill="#9aa3c7" font-size="10">to expert choice</text>

    <!-- Column 2: Informative -->
    <rect x="168" y="66" width="148" height="44" fill="#1f2436" stroke="#cdd3e8" stroke-width="3"/>
    <text x="242" y="85" fill="#cdd3e8" font-size="12" font-weight="bold">Fixed, Settled Values</text>
    <text x="242" y="101" fill="#9aa3c7" font-size="10.5">patient seeks facts</text>

    <path d="M242 110 L242 126" stroke="#cdd3e8" stroke-width="3" fill="none"/>
    <path d="M237 120 L242 128 L247 120 Z" fill="#cdd3e8"/>

    <rect x="168" y="128" width="148" height="76" fill="#232838" stroke="#cdd3e8" stroke-width="3"/>
    <text x="242" y="149" fill="#eef1ff" font-size="14" font-weight="bold">Informative</text>
    <text x="242" y="167" fill="#eef1ff" font-size="11.5">Doctor as Technician</text>
    <text x="242" y="184" fill="#9aa3c7" font-size="10.5">Patient decides alone</text>
    <text x="242" y="196" fill="#9aa3c7" font-size="10">execution of choice</text>

    <!-- Column 3: Interpretive -->
    <rect x="324" y="66" width="148" height="44" fill="#20304a" stroke="#4cc2ff" stroke-width="3"/>
    <text x="398" y="85" fill="#4cc2ff" font-size="12" font-weight="bold">Unclear / Conflicted</text>
    <text x="398" y="101" fill="#a8c4dd" font-size="10.5">values need clarifying</text>

    <path d="M398 110 L398 126" stroke="#4cc2ff" stroke-width="3" fill="none"/>
    <path d="M393 120 L398 128 L403 120 Z" fill="#4cc2ff"/>

    <rect x="324" y="128" width="148" height="76" fill="#232838" stroke="#4cc2ff" stroke-width="3"/>
    <text x="398" y="149" fill="#4cc2ff" font-size="14" font-weight="bold">Interpretive</text>
    <text x="398" y="167" fill="#eef1ff" font-size="11.5">Doctor as Counselor</text>
    <text x="398" y="184" fill="#9aa3c7" font-size="10.5">Elucidate values</text>
    <text x="398" y="196" fill="#9aa3c7" font-size="10">self-understanding</text>

    <!-- Column 4: Deliberative -->
    <rect x="478" y="66" width="148" height="44" fill="#133a24" stroke="#46e07a" stroke-width="3"/>
    <text x="552" y="85" fill="#46e07a" font-size="12" font-weight="bold">Open to Dialogue</text>
    <text x="552" y="101" fill="#a8e6b8" font-size="10.5">values can be grown</text>

    <path d="M552 110 L552 126" stroke="#46e07a" stroke-width="3" fill="none"/>
    <path d="M547 120 L552 128 L557 120 Z" fill="#46e07a"/>

    <rect x="478" y="128" width="148" height="76" fill="#183627" stroke="#46e07a" stroke-width="3"/>
    <text x="552" y="149" fill="#46e07a" font-size="14" font-weight="bold">Deliberative ★</text>
    <text x="552" y="167" fill="#eef1ff" font-size="11.5">Teacher &amp; Friend</text>
    <text x="552" y="184" fill="#a8e6b8" font-size="10.5">Moral development</text>
    <text x="552" y="196" fill="#a8e6b8" font-size="10">persuasion, not force</text>

    <!-- Footer Summary Note -->
    <rect x="14" y="214" width="612" height="24" fill="#141824" stroke="#2d354d" stroke-width="2"/>
    <text x="320" y="230" fill="#cdd3e8" font-size="11.5">The Emanuels defend the Deliberative model as the ideal: genuine care deliberates about what is worth wanting.</text>
  </g>
</svg>
