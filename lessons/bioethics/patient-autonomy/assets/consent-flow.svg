<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" shape-rendering="crispEdges" role="img" aria-label="Clinical flowchart for informed consent and capacity. First assess decision-making capacity across four abilities: understand, appreciate, reason, communicate. If capacity is lacking, transition to a surrogate decision-maker under substituted judgment or best interests. If capacity is present, proceed through adequate disclosure under the reasonable-patient standard, verify understanding using teach-back dialogue, and ensure voluntariness free of coercion or manipulation. If the patient authorizes, proceed with treatment; if the competent patient refuses, respect the refusal as an exercise of autonomy.">
  <rect width="640" height="250" fill="#1a1f31"/>
  <g font-family="Verdana, DejaVu Sans, sans-serif" text-anchor="middle">

    <!-- 1. Capacity -->
    <rect x="14" y="28" width="108" height="58" fill="#3a3418" stroke="#ffcf5a" stroke-width="3"/>
    <text x="68" y="52" fill="#ffcf5a" font-size="14" font-weight="bold">1 · Capacity</text>
    <text x="68" y="72" fill="#ddcb9a" font-size="11.5">4 core abilities</text>

    <!-- Arrow down to Surrogate if No -->
    <path d="M68 86 L68 136" stroke="#ff6a6a" stroke-width="3" fill="none"/>
    <path d="M62 130 L68 142 L74 130 Z" fill="#ff6a6a"/>
    <text x="90" y="114" fill="#ff6a6a" font-size="11" font-weight="bold">NO</text>

    <!-- Incapacity Box -->
    <rect x="14" y="142" width="108" height="54" fill="#2d1c24" stroke="#ff6a6a" stroke-width="3"/>
    <text x="68" y="164" fill="#ff6a6a" font-size="12.5" font-weight="bold">Incapacity</text>
    <text x="68" y="182" fill="#e8a2a8" font-size="11">surrogate / proxy</text>

    <!-- Arrow right to Disclosure if Yes -->
    <path d="M122 57 L148 57" stroke="#9aa3c7" stroke-width="3" fill="none"/>
    <path d="M142 51 L152 57 L142 63 Z" fill="#9aa3c7"/>
    <text x="135" y="48" fill="#46e07a" font-size="10.5" font-weight="bold">YES</text>

    <!-- 2. Disclosure -->
    <rect x="152" y="28" width="106" height="58" fill="#20304a" stroke="#4cc2ff" stroke-width="3"/>
    <text x="205" y="52" fill="#4cc2ff" font-size="14" font-weight="bold">2 · Disclose</text>
    <text x="205" y="72" fill="#a8c4dd" font-size="11.5">risks &amp; options</text>

    <!-- Arrow right to Understanding -->
    <path d="M258 57 L284 57" stroke="#9aa3c7" stroke-width="3" fill="none"/>
    <path d="M278 51 L288 57 L278 63 Z" fill="#9aa3c7"/>

    <!-- 3. Understanding -->
    <rect x="288" y="28" width="112" height="58" fill="#20304a" stroke="#4cc2ff" stroke-width="3"/>
    <text x="344" y="52" fill="#4cc2ff" font-size="14" font-weight="bold">3 · Grasp</text>
    <text x="344" y="72" fill="#a8c4dd" font-size="11.5">teach-back check</text>

    <!-- Arrow right to Voluntariness -->
    <path d="M400 57 L426 57" stroke="#9aa3c7" stroke-width="3" fill="none"/>
    <path d="M420 51 L430 57 L420 63 Z" fill="#9aa3c7"/>

    <!-- 4. Voluntariness -->
    <rect x="430" y="28" width="102" height="58" fill="#2a1a24" stroke="#ff6ad5" stroke-width="3"/>
    <text x="481" y="52" fill="#ff6ad5" font-size="14" font-weight="bold">4 · Voluntary</text>
    <text x="481" y="72" fill="#dca5cf" font-size="11.5">no coercion</text>

    <!-- Arrow right to Authorization -->
    <path d="M532 57 L554 57" stroke="#9aa3c7" stroke-width="3" fill="none"/>
    <path d="M548 51 L558 57 L548 63 Z" fill="#9aa3c7"/>

    <!-- 5. Authorization Split Node -->
    <rect x="558" y="28" width="70" height="58" fill="#232838" stroke="#cdd3e8" stroke-width="3"/>
    <text x="593" y="52" fill="#eef1ff" font-size="14" font-weight="bold">5 · Act</text>
    <text x="593" y="72" fill="#9aa3c7" font-size="11.5">decision</text>

    <!-- Branch Down to Consent -->
    <g stroke="#46e07a" stroke-width="3" fill="none">
      <path d="M593 86 L593 116 L530 116 L530 140"/>
    </g>
    <path d="M524 134 L530 144 L536 134 Z" fill="#46e07a"/>
    <text x="572" y="110" fill="#46e07a" font-size="10.5" font-weight="bold">AGREES</text>

    <rect x="445" y="144" width="170" height="52" fill="#133a24" stroke="#46e07a" stroke-width="3"/>
    <text x="530" y="166" fill="#46e07a" font-size="13" font-weight="bold">✓ Valid Consent</text>
    <text x="530" y="185" fill="#a8e6b8" font-size="11">Authorize treatment</text>

    <!-- Branch Left to Refusal -->
    <g stroke="#ffcf5a" stroke-width="3" fill="none">
      <path d="M575 86 L575 124 L275 124 L275 140"/>
    </g>
    <path d="M269 134 L275 144 L281 134 Z" fill="#ffcf5a"/>
    <text x="350" y="119" fill="#ffcf5a" font-size="10.5" font-weight="bold">REFUSES</text>

    <rect x="175" y="144" width="200" height="52" fill="#3a3418" stroke="#ffcf5a" stroke-width="3"/>
    <text x="275" y="166" fill="#ffcf5a" font-size="13" font-weight="bold">Autonomous Refusal</text>
    <text x="275" y="185" fill="#ddcb9a" font-size="11">Respect choice; cannot force</text>

    <!-- Footer Summary Note -->
    <rect x="14" y="212" width="614" height="26" fill="#141824" stroke="#2d354d" stroke-width="2"/>
    <text x="320" y="229" fill="#cdd3e8" font-size="12">All five elements must hold. If capacity fails, turn to surrogates; if the patient refuses, autonomy governs.</text>
  </g>
</svg>
