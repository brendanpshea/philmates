<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" shape-rendering="crispEdges" role="img" aria-label="Clinical flowchart for informed consent and capacity. First assess decision-making capacity across four abilities: understand, appreciate, reason, communicate. If capacity is lacking, transition to a surrogate decision-maker under substituted judgment or best interests. If capacity is present, proceed through adequate disclosure under the reasonable-patient standard, verify understanding using teach-back dialogue, and ensure voluntariness free of coercion or manipulation. If the patient authorizes, proceed with treatment; if the competent patient refuses, respect the refusal as an exercise of autonomy.">
  <rect width="640" height="250" fill="#1a1f31"/>
  <g font-family="Verdana, DejaVu Sans, sans-serif" text-anchor="middle">

    <!-- 1. Capacity -->
    <rect x="14" y="32" width="108" height="56" fill="#232838" stroke="#ffcf5a" stroke-width="3"/>
    <text x="68" y="55" fill="#ffcf5a" font-size="13" font-weight="bold">1 · Capacity</text>
    <text x="68" y="74" fill="#ddcb9a" font-size="11">4 core abilities</text>

    <!-- Arrow down to Surrogate if No -->
    <path d="M68 88 L68 140" stroke="#ff6a6a" stroke-width="2.5" fill="none"/>
    <path d="M63 134 L68 144 L73 134 Z" fill="#ff6a6a"/>
    <text x="88" y="116" fill="#ff6a6a" font-size="10" font-weight="bold">NO</text>

    <!-- Incapacity Box -->
    <rect x="14" y="144" width="108" height="52" fill="#2d1c24" stroke="#ff6a6a" stroke-width="2.5"/>
    <text x="68" y="165" fill="#ff6a6a" font-size="11.5" font-weight="bold">Incapacity</text>
    <text x="68" y="183" fill="#e8a2a8" font-size="10">Surrogate / proxy</text>

    <!-- Arrow right to Disclosure if Yes -->
    <path d="M122 60 L148 60" stroke="#ffcf5a" stroke-width="2.5" fill="none"/>
    <path d="M142 55 L152 60 L142 65 Z" fill="#ffcf5a"/>
    <text x="135" y="52" fill="#46e07a" font-size="10" font-weight="bold">YES</text>

    <!-- 2. Disclosure -->
    <rect x="152" y="32" width="106" height="56" fill="#232838" stroke="#4cc2ff" stroke-width="3"/>
    <text x="205" y="55" fill="#4cc2ff" font-size="13" font-weight="bold">2 · Disclosure</text>
    <text x="205" y="74" fill="#9aa3c7" font-size="11">risks &amp; options</text>

    <!-- Arrow right to Understanding -->
    <path d="M258 60 L282 60" stroke="#9aa3c7" stroke-width="2.5" fill="none"/>
    <path d="M276 55 L286 60 L276 65 Z" fill="#9aa3c7"/>

    <!-- 3. Understanding -->
    <rect x="286" y="32" width="112" height="56" fill="#232838" stroke="#4cc2ff" stroke-width="3"/>
    <text x="342" y="55" fill="#4cc2ff" font-size="13" font-weight="bold">3 · Understand</text>
    <text x="342" y="74" fill="#a8c4dd" font-size="11">teach-back check</text>

    <!-- Arrow right to Voluntariness -->
    <path d="M398 60 L422 60" stroke="#9aa3c7" stroke-width="2.5" fill="none"/>
    <path d="M416 55 L426 60 L416 65 Z" fill="#9aa3c7"/>

    <!-- 4. Voluntariness -->
    <rect x="426" y="32" width="102" height="56" fill="#232838" stroke="#ff6ad5" stroke-width="3"/>
    <text x="477" y="55" fill="#ff6ad5" font-size="13" font-weight="bold">4 · Voluntary</text>
    <text x="477" y="74" fill="#dca5cf" font-size="11">no coercion</text>

    <!-- Arrow right to Authorization -->
    <path d="M528 60 L550 60" stroke="#9aa3c7" stroke-width="2.5" fill="none"/>
    <path d="M544 55 L554 60 L544 65 Z" fill="#9aa3c7"/>

    <!-- 5. Authorization Split Node -->
    <rect x="554" y="32" width="76" height="56" fill="#232838" stroke="#cdd3e8" stroke-width="3"/>
    <text x="592" y="55" fill="#eef1ff" font-size="13" font-weight="bold">5 · Choice</text>
    <text x="592" y="74" fill="#9aa3c7" font-size="11">the patient</text>

    <!-- Branch Down to Consent -->
    <g stroke="#46e07a" stroke-width="2.5" fill="none">
      <path d="M592 88 L592 118 L530 118 L530 144"/>
    </g>
    <path d="M525 138 L530 148 L535 138 Z" fill="#46e07a"/>
    <text x="570" y="112" fill="#46e07a" font-size="10" font-weight="bold">AGREES</text>

    <rect x="445" y="148" width="170" height="50" fill="#133a24" stroke="#46e07a" stroke-width="3"/>
    <text x="530" y="170" fill="#46e07a" font-size="12.5" font-weight="bold">✓ Valid Consent</text>
    <text x="530" y="188" fill="#a8e6b8" font-size="10.5">Authorize treatment</text>

    <!-- Branch Left to Refusal -->
    <g stroke="#ffcf5a" stroke-width="2.5" fill="none">
      <path d="M570 88 L570 126 L270 126 L270 144"/>
    </g>
    <path d="M265 138 L270 148 L275 138 Z" fill="#ffcf5a"/>
    <text x="350" y="121" fill="#ffcf5a" font-size="10" font-weight="bold">REFUSES</text>

    <rect x="175" y="148" width="190" height="50" fill="#2b271a" stroke="#ffcf5a" stroke-width="3"/>
    <text x="270" y="170" fill="#ffcf5a" font-size="12.5" font-weight="bold">Autonomous Refusal</text>
    <text x="270" y="188" fill="#ddcb9a" font-size="10.5">Respect choice; cannot force</text>

    <!-- Footer Summary Note -->
    <rect x="14" y="212" width="612" height="26" fill="#141824" stroke="#2d354d" stroke-width="1.5"/>
    <text x="320" y="229" fill="#cdd3e8" font-size="11.5">All five elements must hold. If capacity fails, turn to surrogates; if the patient refuses, autonomy governs.</text>
  </g>
</svg>
