<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 108" shape-rendering="crispEdges" role="img" aria-label="Relic card: Judith Jarvis Thomson — unplugged cord curled around a violin">
  <!-- card frame -->
  <rect width="80" height="108" fill="#050610"/>
  <rect x="2" y="2" width="76" height="104" fill="#ff6ad5"/>
  <rect x="4" y="4" width="72" height="100" fill="#1d2235"/>
  <!-- title bar + rank gem -->
  <rect x="7" y="7" width="66" height="12" fill="#262c44"/>
  <polygon points="40,8 45,13 40,18 35,13" fill="#ff6ad5"/>
  <!-- bottom plate + rarity pips -->
  <rect x="7" y="89" width="66" height="12" fill="#262c44"/>
  <rect x="32" y="93" width="4" height="4" fill="#ff6ad5"/>
  <rect x="38" y="93" width="4" height="4" fill="#ff6ad5"/>
  <rect x="44" y="93" width="4" height="4" fill="#ff6ad5"/>

  <!-- violin body & neck -->
  <!-- scroll and pegbox -->
  <rect x="38" y="24" width="4" height="6" fill="#8a4e24"/>
  <rect x="36" y="26" width="8" height="2" fill="#d49b28"/>
  <rect x="37" y="25" width="2" height="2" fill="#502b13"/>
  <!-- neck / fingerboard -->
  <rect x="38" y="30" width="4" height="18" fill="#11131f"/>
  <rect x="37" y="30" width="1" height="18" fill="#8a4e24"/>
  <rect x="42" y="30" width="1" height="18" fill="#8a4e24"/>
  <!-- violin upper bout -->
  <rect x="30" y="48" width="20" height="10" fill="#c07b46"/>
  <rect x="32" y="46" width="16" height="2" fill="#c07b46"/>
  <!-- waist -->
  <rect x="33" y="58" width="14" height="8" fill="#a45f2e"/>
  <!-- f-holes -->
  <rect x="34" y="60" width="2" height="4" fill="#11131f"/>
  <rect x="44" y="60" width="2" height="4" fill="#11131f"/>
  <!-- lower bout -->
  <rect x="28" y="66" width="24" height="14" fill="#c07b46"/>
  <rect x="30" y="80" width="20" height="2" fill="#8a4e24"/>
  <!-- bridge & tailpiece -->
  <rect x="38" y="64" width="4" height="2" fill="#ffe9a8"/>
  <rect x="39" y="68" width="2" height="10" fill="#11131f"/>

  <!-- medical cord curling around neck -->
  <!-- cord path -->
  <rect x="22" y="38" width="14" height="2" fill="#4cc2ff"/>
  <rect x="20" y="40" width="2" height="12" fill="#4cc2ff"/>
  <rect x="22" y="52" width="8" height="2" fill="#4cc2ff"/>
  <!-- curl across violin neck -->
  <rect x="36" y="36" width="8" height="3" fill="#eef1ff"/>
  <rect x="44" y="37" width="6" height="2" fill="#4cc2ff"/>
  <rect x="50" y="39" width="2" height="10" fill="#4cc2ff"/>
  <rect x="52" y="49" width="6" height="2" fill="#4cc2ff"/>

  <!-- unplugged plug resting just apart from socket -->
  <!-- wall socket -->
  <rect x="58" y="45" width="4" height="10" fill="#505670"/>
  <rect x="60" y="47" width="1" height="2" fill="#11131f"/>
  <rect x="60" y="51" width="1" height="2" fill="#11131f"/>
  <!-- plug body -->
  <rect x="50" y="48" width="4" height="4" fill="#eef1ff"/>
  <!-- plug metal prongs extending towards socket but detached -->
  <rect x="54" y="48" width="2" height="1" fill="#ffcf5a"/>
  <rect x="54" y="51" width="2" height="1" fill="#ffcf5a"/>
  <!-- glowing aura around gap showing autonomy disconnect -->
  <rect x="56" y="46" width="2" height="8" fill="#ff6ad5" opacity="0.6"/>
</svg>
