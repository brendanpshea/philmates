<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 108" shape-rendering="crispEdges" role="img" aria-label="Relic card: Norman Daniels — five paths fan out from a small harbor; one path is broken and bridged by a splint">
  <!-- card frame -->
  <rect width="80" height="108" fill="#050610"/>
  <rect x="2" y="2" width="76" height="104" fill="#46e07a"/>
  <rect x="4" y="4" width="72" height="100" fill="#1d2235"/>
  <!-- title bar + rank gem -->
  <rect x="7" y="7" width="66" height="12" fill="#262c44"/>
  <polygon points="40,8 45,13 40,18 35,13" fill="#46e07a"/>
  <!-- bottom plate + rarity pips -->
  <rect x="7" y="89" width="66" height="12" fill="#262c44"/>
  <rect x="32" y="93" width="4" height="4" fill="#46e07a"/>
  <rect x="38" y="93" width="4" height="4" fill="#46e07a"/>
  <rect x="44" y="93" width="4" height="4" fill="#46e07a"/>

  <!-- five paths fanning out from the harbor -->
  <g stroke="#9aa3c7" stroke-width="3" fill="none">
    <line x1="40" y1="80" x2="14" y2="32"/>
    <line x1="40" y1="80" x2="26" y2="27"/>
    <line x1="40" y1="80" x2="40" y2="25"/>
    <line x1="40" y1="80" x2="54" y2="27"/>
  </g>
  <!-- the fifth path, broken in the middle -->
  <g stroke="#9aa3c7" stroke-width="3" fill="none">
    <line x1="40" y1="80" x2="51" y2="62"/>
    <line x1="57" y1="51" x2="66" y2="32"/>
  </g>
  <!-- splint across the break -->
  <rect x="48" y="54" width="12" height="3" fill="#ffcf5a"/>
  <rect x="48" y="59" width="12" height="3" fill="#ffcf5a"/>
  <rect x="52" y="53" width="2" height="10" fill="#eef1ff"/>
  <!-- a lit goal at the end of each path -->
  <rect x="12" y="28" width="5" height="5" fill="#46e07a"/>
  <rect x="24" y="23" width="5" height="5" fill="#46e07a"/>
  <rect x="38" y="21" width="5" height="5" fill="#46e07a"/>
  <rect x="52" y="23" width="5" height="5" fill="#46e07a"/>
  <rect x="64" y="28" width="5" height="5" fill="#46e07a"/>
  <!-- the harbor -->
  <rect x="26" y="80" width="28" height="4" fill="#8a6a44"/>
  <rect x="28" y="84" width="3" height="4" fill="#6b4a2e"/>
  <rect x="49" y="84" width="3" height="4" fill="#6b4a2e"/>
  <rect x="10" y="84" width="60" height="4" fill="#16304d"/>
</svg>
