<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 108" shape-rendering="crispEdges" role="img" aria-label="Relic card: H. Tristram Engelhardt — a lottery drum on a stand with a storm cloud and lightning bolt inside its window">
  <!-- card frame -->
  <rect width="80" height="108" fill="#050610"/>
  <rect x="2" y="2" width="76" height="104" fill="#ff6ad5"/>
  <rect x="4" y="4" width="72" height="100" fill="#1d2235"/>
  <!-- title bar + rank gem -->
  <rect x="7" y="7" width="66" height="12" fill="#262c44"/>
  <polygon points="40,8 45,13 40,18 35,13" fill="#ff6ad5"/>
  <!-- bottom plate + rarity pips -->
  <rect x="7" y="89" width="66" height="12" fill="#262c44"/>
  <rect x="32" y="93" width="4" height="4" fill="#ff6ad5"/>
  <rect x="38" y="93" width="4" height="4" fill="#ff6ad5"/>
  <rect x="44" y="93" width="4" height="4" fill="#ff6ad5"/>

  <!-- the lottery drum -->
  <rect x="16" y="30" width="46" height="38" fill="#050610"/>
  <rect x="18" y="32" width="42" height="34" fill="#3a4260"/>
  <rect x="18" y="32" width="42" height="3" fill="#6b7499"/>
  <!-- window into the drum -->
  <rect x="23" y="38" width="32" height="24" fill="#11131f"/>
  <!-- storm cloud inside -->
  <rect x="27" y="42" width="22" height="5" fill="#9aa3c7"/>
  <rect x="30" y="39" width="10" height="4" fill="#9aa3c7"/>
  <rect x="40" y="40" width="7" height="3" fill="#9aa3c7"/>
  <!-- lightning -->
  <polygon points="38,47 33,55 37,55 34,61 43,51 39,51 42,47" fill="#ff6ad5"/>
  <!-- crank -->
  <rect x="62" y="47" width="7" height="3" fill="#9aa3c7"/>
  <rect x="67" y="43" width="3" height="11" fill="#ffcf5a"/>
  <!-- stand -->
  <rect x="22" y="68" width="3" height="16" fill="#6b4a2e"/>
  <rect x="53" y="68" width="3" height="16" fill="#6b4a2e"/>
  <rect x="18" y="83" width="42" height="3" fill="#6b4a2e"/>
  <!-- two drawn balls -->
  <rect x="32" y="78" width="5" height="5" fill="#ff6ad5"/>
  <rect x="41" y="78" width="5" height="5" fill="#eef1ff"/>
</svg>
