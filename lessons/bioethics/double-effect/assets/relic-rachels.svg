<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 108" shape-rendering="crispEdges" role="img" aria-label="Relic card: James Rachels — two identical top hats side by side above one closed door">
  <!-- card frame -->
  <rect width="80" height="108" fill="#050610"/>
  <rect x="2" y="2" width="76" height="104" fill="#ff6ad5"/>
  <rect x="4" y="4" width="72" height="100" fill="#1d2235"/>
  <!-- title bar + rank gem -->
  <rect x="7" y="7" width="66" height="12" fill="#262c44"/>
  <polygon points="40,8 45,13 40,18 35,13" fill="#ff6ad5"/>
  <!-- bottom plate + rarity pips -->
  <rect x="7" y="89" width="66" height="12" fill="#262c44"/>
  <rect x="32" y="93" width="4" height="4" fill="#ff6ad5"/>
  <rect x="38" y="93" width="4" height="4" fill="#ff6ad5"/>
  <rect x="44" y="93" width="4" height="4" fill="#ff6ad5"/>

  <!-- two identical top hats -->
  <g id="hat">
    <rect x="16" y="26" width="16" height="16" fill="#6b7499"/>
    <rect x="16" y="37" width="16" height="3" fill="#ff6ad5"/>
    <rect x="12" y="42" width="24" height="3" fill="#6b7499"/>
    <rect x="16" y="26" width="16" height="2" fill="#8a95b0"/>
  </g>
  <use href="#hat" x="32"/>

  <!-- one closed door beneath them -->
  <rect x="26" y="50" width="28" height="36" fill="#3a4260"/>
  <rect x="28" y="52" width="24" height="34" fill="#2b334d"/>
  <rect x="31" y="55" width="18" height="12" fill="#262c44"/>
  <rect x="31" y="70" width="18" height="13" fill="#262c44"/>
  <rect x="47" y="68" width="3" height="3" fill="#ffcf5a"/>
  <!-- line of light under the door -->
  <rect x="28" y="85" width="24" height="2" fill="#ffcf5a"/>
</svg>
