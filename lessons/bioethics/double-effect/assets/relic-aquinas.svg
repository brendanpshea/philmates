<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 108" shape-rendering="crispEdges" role="img" aria-label="Relic card: Thomas Aquinas — a round shield raised against a falling sword, casting two shadows">
  <!-- card frame -->
  <rect width="80" height="108" fill="#050610"/>
  <rect x="2" y="2" width="76" height="104" fill="#ffcf5a"/>
  <rect x="4" y="4" width="72" height="100" fill="#1d2235"/>
  <!-- title bar + rank gem -->
  <rect x="7" y="7" width="66" height="12" fill="#262c44"/>
  <polygon points="40,8 45,13 40,18 35,13" fill="#ffcf5a"/>
  <!-- bottom plate + rarity pips -->
  <rect x="7" y="89" width="66" height="12" fill="#262c44"/>
  <rect x="32" y="93" width="4" height="4" fill="#ffcf5a"/>
  <rect x="38" y="93" width="4" height="4" fill="#ffcf5a"/>
  <rect x="44" y="93" width="4" height="4" fill="#ffcf5a"/>

  <!-- ground line -->
  <rect x="12" y="78" width="56" height="2" fill="#3a4260"/>
  <!-- two shadows of the shield: green (intended) and magenta (foreseen) -->
  <ellipse cx="28" cy="82" rx="11" ry="3" fill="#46e07a"/>
  <ellipse cx="54" cy="82" rx="11" ry="3" fill="#ff6ad5"/>

  <!-- falling sword, point down toward the shield -->
  <rect x="52" y="24" width="3" height="22" fill="#eef1ff" transform="rotate(28 53 35)"/>
  <rect x="55" y="20" width="9" height="3" fill="#8a95b0" transform="rotate(28 59 21)"/>
  <rect x="59" y="14" width="3" height="7" fill="#d49b28" transform="rotate(28 60 17)"/>

  <!-- round shield -->
  <circle cx="38" cy="56" r="17" fill="#d49b28"/>
  <circle cx="38" cy="56" r="14" fill="#262c44"/>
  <circle cx="38" cy="56" r="11" fill="#ffcf5a"/>
  <circle cx="38" cy="56" r="4" fill="#d49b28"/>
  <!-- spark where the blade meets the rim -->
  <rect x="47" y="42" width="3" height="3" fill="#eef1ff"/>
  <rect x="51" y="39" width="2" height="2" fill="#eef1ff"/>
  <rect x="44" y="38" width="2" height="2" fill="#eef1ff"/>
</svg>
