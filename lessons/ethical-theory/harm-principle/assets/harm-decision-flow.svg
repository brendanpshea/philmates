<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 215" shape-rendering="crispEdges" role="img" aria-label="Mill's Harm Principle decision flowchart. Conduct is divided into self-regarding and other-regarding. For self-regarding conduct: if the agent is uninformed or in danger, soft paternalism permits pausing and warning them; if the agent is an informed adult, coercion is strictly forbidden and the individual is sovereign. For other-regarding conduct: if it causes mere offense or disgust, coercion is forbidden and differences must be tolerated; if it causes direct harm, coercion is justified to protect others.">
  <rect width="640" height="215" fill="#1a1f31"/>
  <g font-family="Verdana, DejaVu Sans, sans-serif" text-anchor="middle">

    <!-- Header / Root Question -->
    <rect x="14" y="8" width="612" height="32" fill="#3a3418" stroke="#ffcf5a" stroke-width="3"/>
    <text x="320" y="29" fill="#ffcf5a" font-size="13" font-weight="bold">Mill's Test: When May the State Compel an Individual?</text>

    <!-- Branch Lines from Root -->
    <g stroke="#9aa3c7" stroke-width="3" fill="none">
      <path d="M320 40 L320 48 L161 48 L161 54"/>
      <path d="M320 48 L479 48 L479 54"/>
    </g>

    <!-- 1. Left Box: Self-Regarding -->
    <rect x="14" y="54" width="294" height="40" fill="#1b2a3a" stroke="#4cc2ff" stroke-width="3"/>
    <text x="161" y="72" fill="#4cc2ff" font-size="12.5" font-weight="bold">Self-Regarding Conduct</text>
    <text x="161" y="86" fill="#a8c4dd" font-size="10">Touches only the individual</text>

    <!-- 2. Right Box: Other-Regarding -->
    <rect x="332" y="54" width="294" height="40" fill="#2a1a28" stroke="#ff6ad5" stroke-width="3"/>
    <text x="479" y="72" fill="#ff6ad5" font-size="12.5" font-weight="bold">Other-Regarding Conduct</text>
    <text x="479" y="86" fill="#dca5cf" font-size="10">Touches non-consenting others</text>

    <!-- Sub-branch lines Left -->
    <g stroke="#9aa3c7" stroke-width="3" fill="none">
      <path d="M161 94 L161 100 L84 100 L84 106"/>
      <path d="M161 100 L238 100 L238 106"/>
    </g>

    <!-- Sub-branch lines Right -->
    <g stroke="#9aa3c7" stroke-width="3" fill="none">
      <path d="M479 94 L479 100 L402 100 L402 106"/>
      <path d="M479 100 L556 100 L556 106"/>
    </g>

    <!-- Column 1A: Uninformed / Incapacitated -->
    <rect x="14" y="106" width="140" height="28" fill="#2d1c24" stroke="#ff6a6a" stroke-width="2.5"/>
    <text x="84" y="124" fill="#ff6a6a" font-size="10" font-weight="bold">Uninformed / Hazard</text>

    <path d="M84 134 L84 142" stroke="#ff6a6a" stroke-width="2.5" fill="none"/>

    <rect x="14" y="142" width="140" height="62" fill="#232838" stroke="#ffcf5a" stroke-width="3"/>
    <text x="84" y="162" fill="#ffcf5a" font-size="11.5" font-weight="bold">Soft Paternalism</text>
    <text x="84" y="179" fill="#ddcb9a" font-size="10">Pause &amp; warn only</text>
    <text x="84" y="193" fill="#9aa3c7" font-size="9">Verify voluntary choice</text>

    <!-- Column 1B: Competent & Voluntary -->
    <rect x="168" y="106" width="140" height="28" fill="#1b2a24" stroke="#46e07a" stroke-width="2.5"/>
    <text x="238" y="124" fill="#46e07a" font-size="10" font-weight="bold">Informed Adult</text>

    <path d="M238 134 L238 142" stroke="#46e07a" stroke-width="2.5" fill="none"/>

    <rect x="168" y="142" width="140" height="62" fill="#232838" stroke="#46e07a" stroke-width="3"/>
    <text x="238" y="162" fill="#46e07a" font-size="11.5" font-weight="bold">Coercion Forbidden</text>
    <text x="238" y="179" fill="#a4e4be" font-size="10">Individual sovereign</text>
    <text x="238" y="193" fill="#9aa3c7" font-size="9">Advice &amp; persuasion only</text>

    <!-- Column 2A: Mere Offense / Disapproval -->
    <rect x="332" y="106" width="140" height="28" fill="#2d1c24" stroke="#ff6a6a" stroke-width="2.5"/>
    <text x="402" y="124" fill="#ff6a6a" font-size="10" font-weight="bold">Mere Disgust / Offense</text>

    <path d="M402 134 L402 142" stroke="#ff6a6a" stroke-width="2.5" fill="none"/>

    <rect x="332" y="142" width="140" height="62" fill="#232838" stroke="#ff6a6a" stroke-width="3"/>
    <text x="402" y="162" fill="#ff6a6a" font-size="11.5" font-weight="bold">Coercion Forbidden</text>
    <text x="402" y="179" fill="#e8a2a8" font-size="10">Tolerate differences</text>
    <text x="402" y="193" fill="#9aa3c7" font-size="9">Offense is not harm</text>

    <!-- Column 2B: Direct Harm / Breach -->
    <rect x="486" y="106" width="140" height="28" fill="#1b2a3a" stroke="#4cc2ff" stroke-width="2.5"/>
    <text x="556" y="124" fill="#4cc2ff" font-size="10" font-weight="bold">Direct Harm to Others</text>

    <path d="M556 134 L556 142" stroke="#4cc2ff" stroke-width="2.5" fill="none"/>

    <rect x="486" y="142" width="140" height="62" fill="#232838" stroke="#4cc2ff" stroke-width="3"/>
    <text x="556" y="162" fill="#4cc2ff" font-size="11.5" font-weight="bold">Coercion Justified</text>
    <text x="556" y="179" fill="#a8c4dd" font-size="10">State power legitimate</text>
    <text x="556" y="193" fill="#9aa3c7" font-size="9">To prevent injury</text>

  </g>
</svg>
