<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" shape-rendering="crispEdges" role="img" aria-label="Mill's Harm Principle decision flowchart. First, evaluate whether conduct is self-regarding or other-regarding. If self-regarding, check if the agent is competent and informed: if unaware of risk or incapacitated, soft paternalism permits pausing or warning them; if competent and informed, state coercion is strictly forbidden and the individual is sovereign. If other-regarding, determine if it causes direct harm or mere offense: if mere offense or moral disapproval, coercion is forbidden; if direct harm or rights violation, state coercion and legal sanctions are justified.">
  <rect width="640" height="270" fill="#1a1f31"/>
  <g font-family="Verdana, DejaVu Sans, sans-serif" text-anchor="middle">

    <!-- Header / Root Question -->
    <rect x="14" y="10" width="612" height="36" fill="#3a3418" stroke="#ffcf5a" stroke-width="3"/>
    <text x="320" y="33" fill="#ffcf5a" font-size="13.5" font-weight="bold">Mill's Test: When May the State Compel an Individual?</text>

    <!-- Branch Lines from Root -->
    <g stroke="#9aa3c7" stroke-width="3" fill="none">
      <path d="M320 46 L320 56 L161 56 L161 66"/>
      <path d="M320 56 L479 56 L479 66"/>
    </g>

    <!-- 1. Left Box: Self-Regarding -->
    <rect x="14" y="66" width="294" height="46" fill="#1b2a3a" stroke="#4cc2ff" stroke-width="3"/>
    <text x="161" y="86" fill="#4cc2ff" font-size="13" font-weight="bold">1 · Self-Regarding Conduct</text>
    <text x="161" y="102" fill="#a8c4dd" font-size="10.5">Affects primarily the agent's own body &amp; mind</text>

    <!-- 2. Right Box: Other-Regarding -->
    <rect x="332" y="66" width="294" height="46" fill="#2a1a28" stroke="#ff6ad5" stroke-width="3"/>
    <text x="479" y="86" fill="#ff6ad5" font-size="13" font-weight="bold">2 · Other-Regarding Conduct</text>
    <text x="479" y="102" fill="#dca5cf" font-size="10.5">Directly affects non-consenting third parties</text>

    <!-- Sub-branch lines Left -->
    <g stroke="#9aa3c7" stroke-width="3" fill="none">
      <path d="M161 112 L161 122 L84 122 L84 132"/>
      <path d="M161 122 L238 122 L238 132"/>
    </g>

    <!-- Sub-branch lines Right -->
    <g stroke="#9aa3c7" stroke-width="3" fill="none">
      <path d="M479 112 L479 122 L402 122 L402 132"/>
      <path d="M479 122 L556 122 L556 132"/>
    </g>

    <!-- Column 1A: Uninformed / Incapacitated -->
    <rect x="14" y="132" width="140" height="38" fill="#2d1c24" stroke="#ff6a6a" stroke-width="3"/>
    <text x="84" y="149" fill="#ff6a6a" font-size="11" font-weight="bold">Uninformed / Unaware</text>
    <text x="84" y="162" fill="#e8a2a8" font-size="9.5">e.g. broken bridge risk</text>

    <path d="M84 170 L84 182" stroke="#ff6a6a" stroke-width="3" fill="none"/>
    <path d="M79 176 L84 184 L89 176 Z" fill="#ff6a6a"/>

    <rect x="14" y="184" width="140" height="74" fill="#232838" stroke="#ffcf5a" stroke-width="3"/>
    <text x="84" y="204" fill="#ffcf5a" font-size="12" font-weight="bold">Soft Paternalism</text>
    <text x="84" y="221" fill="#eef1ff" font-size="10">Permitted: Pause &amp; warn</text>
    <text x="84" y="235" fill="#ddcb9a" font-size="9.5">Verify choice is voluntary</text>
    <text x="84" y="247" fill="#9aa3c7" font-size="9">No permanent ban</text>

    <!-- Column 1B: Competent & Voluntary -->
    <rect x="168" y="132" width="140" height="38" fill="#1b2a24" stroke="#46e07a" stroke-width="3"/>
    <text x="238" y="149" fill="#46e07a" font-size="11" font-weight="bold">Competent Adult</text>
    <text x="238" y="162" fill="#a4e4be" font-size="9.5">knows risk &amp; chooses</text>

    <path d="M238 170 L238 182" stroke="#46e07a" stroke-width="3" fill="none"/>
    <path d="M233 176 L238 184 L243 176 Z" fill="#46e07a"/>

    <rect x="168" y="184" width="140" height="74" fill="#232838" stroke="#46e07a" stroke-width="3"/>
    <text x="238" y="204" fill="#46e07a" font-size="12" font-weight="bold">Coercion Forbidden</text>
    <text x="238" y="221" fill="#eef1ff" font-size="10">Individual Sovereign</text>
    <text x="238" y="235" fill="#a4e4be" font-size="9.5">Advice &amp; persuasion only</text>
    <text x="238" y="247" fill="#9aa3c7" font-size="9">Hard paternalism ruled out</text>

    <!-- Column 2A: Mere Offense / Disapproval -->
    <rect x="332" y="132" width="140" height="38" fill="#2d1c24" stroke="#ff6a6a" stroke-width="3"/>
    <text x="402" y="149" fill="#ff6a6a" font-size="11" font-weight="bold">Mere Disgust / Offense</text>
    <text x="402" y="162" fill="#e8a2a8" font-size="9.5">harmless private actions</text>

    <path d="M402 170 L402 182" stroke="#ff6a6a" stroke-width="3" fill="none"/>
    <path d="M397 176 L402 184 L407 176 Z" fill="#ff6a6a"/>

    <rect x="332" y="184" width="140" height="74" fill="#232838" stroke="#ff6a6a" stroke-width="3"/>
    <text x="402" y="204" fill="#ff6a6a" font-size="12" font-weight="bold">Coercion Forbidden</text>
    <text x="402" y="221" fill="#eef1ff" font-size="10">Tolerate Differences</text>
    <text x="402" y="235" fill="#e8a2a8" font-size="9.5">Hurt feelings ≠ harm</text>
    <text x="402" y="247" fill="#9aa3c7" font-size="9">No legal moralism</text>

    <!-- Column 2B: Direct Harm / Breach -->
    <rect x="486" y="132" width="140" height="38" fill="#1b2a3a" stroke="#4cc2ff" stroke-width="3"/>
    <text x="556" y="149" fill="#4cc2ff" font-size="11" font-weight="bold">Direct Harm / Breach</text>
    <text x="556" y="162" fill="#a8c4dd" font-size="9.5">injury, theft, contagion</text>

    <path d="M556 170 L556 182" stroke="#4cc2ff" stroke-width="3" fill="none"/>
    <path d="M551 176 L556 184 L561 176 Z" fill="#4cc2ff"/>

    <rect x="486" y="184" width="140" height="74" fill="#232838" stroke="#4cc2ff" stroke-width="3"/>
    <text x="556" y="204" fill="#4cc2ff" font-size="12" font-weight="bold">Coercion Justified</text>
    <text x="556" y="221" fill="#eef1ff" font-size="10">State Powers Legitimate</text>
    <text x="556" y="235" fill="#a8c4dd" font-size="9.5">Criminal &amp; civil regulation</text>
    <text x="556" y="247" fill="#9aa3c7" font-size="9">Preventing injury to others</text>

  </g>
</svg>
