<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 215" shape-rendering="crispEdges" role="img" aria-label="Diagram showing the three tiers of conduct and state authority in liberal philosophy. Tier 1: Self-Regarding conduct where only advice, labels, and education are permitted. Tier 2: Public Offense where time, place, and manner regulations are permitted. Tier 3: Direct Harm to Others where coercive state laws and quarantine are justified.">
  <rect width="640" height="215" fill="#1a1f31"/>
  <g font-family="Verdana, DejaVu Sans, sans-serif" text-anchor="middle">

    <!-- Top Banner -->
    <rect x="14" y="8" width="612" height="30" fill="#232838" stroke="#cdd3e8" stroke-width="3"/>
    <text x="320" y="28" fill="#eef1ff" font-size="12.5" font-weight="bold">The Three Tiers of Conduct &amp; State Authority</text>

    <!-- Column 1: Self-Regarding -->
    <rect x="14" y="44" width="196" height="36" fill="#1b2a3a" stroke="#4cc2ff" stroke-width="3"/>
    <text x="112" y="61" fill="#4cc2ff" font-size="12" font-weight="bold">1 · Self-Regarding</text>
    <text x="112" y="74" fill="#a8c4dd" font-size="9.5">Individual Sovereignty</text>

    <rect x="14" y="84" width="196" height="44" fill="#202534" stroke="#4cc2ff" stroke-width="1.5"/>
    <text x="112" y="102" fill="#eef1ff" font-size="10">Dangerous recreation, diet,</text>
    <text x="112" y="116" fill="#eef1ff" font-size="10">treatment refusal, private habits</text>

    <rect x="14" y="132" width="196" height="76" fill="#1b2a24" stroke="#46e07a" stroke-width="2"/>
    <text x="112" y="151" fill="#46e07a" font-size="10.5" font-weight="bold">State Authority</text>
    <text x="112" y="169" fill="#a4e4be" font-size="9.5">✓ Warning labels &amp; advice</text>
    <text x="112" y="184" fill="#ff6a6a" font-size="9.5">✗ No coercive bans</text>
    <text x="112" y="198" fill="#ff6a6a" font-size="9">✗ No hard paternalism</text>

    <!-- Column 2: Public Offense -->
    <rect x="222" y="44" width="196" height="36" fill="#3a3418" stroke="#ffcf5a" stroke-width="3"/>
    <text x="320" y="61" fill="#ffcf5a" font-size="12" font-weight="bold">2 · Public Offense</text>
    <text x="320" y="74" fill="#ddcb9a" font-size="9.5">Feinberg's Standard</text>

    <rect x="222" y="84" width="196" height="44" fill="#202534" stroke="#ffcf5a" stroke-width="1.5"/>
    <text x="320" y="102" fill="#eef1ff" font-size="10">Funeral picketing, public</text>
    <text x="320" y="116" fill="#eef1ff" font-size="10">indecency, captive nuisance</text>

    <rect x="222" y="132" width="196" height="76" fill="#2d291e" stroke="#ffcf5a" stroke-width="2"/>
    <text x="320" y="151" fill="#ffcf5a" font-size="10.5" font-weight="bold">State Authority</text>
    <text x="320" y="169" fill="#ddcb9a" font-size="9.5">✓ Time, place, manner</text>
    <text x="320" y="184" fill="#ddcb9a" font-size="9.5">✓ Distance buffer zones</text>
    <text x="320" y="198" fill="#ff6a6a" font-size="9">✗ No viewpoint censorship</text>

    <!-- Column 3: Harm to Others -->
    <rect x="430" y="44" width="196" height="36" fill="#2a1a28" stroke="#ff6ad5" stroke-width="3"/>
    <text x="528" y="61" fill="#ff6ad5" font-size="12" font-weight="bold">3 · Harm to Others</text>
    <text x="528" y="74" fill="#dca5cf" font-size="9.5">The Harm Principle</text>

    <rect x="430" y="84" width="196" height="44" fill="#202534" stroke="#ff6ad5" stroke-width="1.5"/>
    <text x="528" y="102" fill="#eef1ff" font-size="10">Assault, toxic dumping,</text>
    <text x="528" y="116" fill="#eef1ff" font-size="10">contagion, reckless driving</text>

    <rect x="430" y="132" width="196" height="76" fill="#241b2a" stroke="#ff6ad5" stroke-width="2"/>
    <text x="528" y="151" fill="#ff6ad5" font-size="10.5" font-weight="bold">State Authority</text>
    <text x="528" y="169" fill="#dca5cf" font-size="9.5">✓ Criminal prosecution</text>
    <text x="528" y="184" fill="#dca5cf" font-size="9.5">✓ Safety &amp; quarantine rules</text>
    <text x="528" y="198" fill="#a4e4be" font-size="9">✓ Legitimate legal coercion</text>

  </g>
</svg>
