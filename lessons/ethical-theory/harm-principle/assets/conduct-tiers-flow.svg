<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" shape-rendering="crispEdges" role="img" aria-label="Diagram showing the three tiers of conduct and state authority in liberal philosophy. Tier 1: Self-Regarding conduct (diet, risky recreation, refusal of treatment) where only advice, labels, and education are permitted, and coercive bans are forbidden. Tier 2: Public Offense (funeral picketing, captive-audience nuisance) where time, place, and manner regulations are permitted, but viewpoint bans are forbidden. Tier 3: Direct Harm to Others (assault, toxic pollution, infectious disease transmission) where coercive state laws, quarantine, and criminal sanctions are fully justified.">
  <rect width="640" height="260" fill="#1a1f31"/>
  <g font-family="Verdana, DejaVu Sans, sans-serif" text-anchor="middle">

    <!-- Top Banner -->
    <rect x="14" y="10" width="612" height="34" fill="#232838" stroke="#cdd3e8" stroke-width="3"/>
    <text x="320" y="32" fill="#eef1ff" font-size="13" font-weight="bold">The Three Tiers of Conduct &amp; State Authority</text>

    <!-- Column 1: Self-Regarding -->
    <rect x="14" y="54" width="196" height="42" fill="#1b2a3a" stroke="#4cc2ff" stroke-width="3"/>
    <text x="112" y="73" fill="#4cc2ff" font-size="12.5" font-weight="bold">1 · Self-Regarding</text>
    <text x="112" y="88" fill="#a8c4dd" font-size="10">Individual Sovereignty</text>

    <rect x="14" y="102" width="196" height="52" fill="#202534" stroke="#4cc2ff" stroke-width="1.5"/>
    <text x="112" y="122" fill="#eef1ff" font-size="10.5">Dangerous sports, diet,</text>
    <text x="112" y="137" fill="#eef1ff" font-size="10.5">treatment refusal, habits</text>

    <rect x="14" y="160" width="196" height="88" fill="#1b2a24" stroke="#46e07a" stroke-width="2"/>
    <text x="112" y="179" fill="#46e07a" font-size="11" font-weight="bold">State Authority</text>
    <text x="112" y="196" fill="#a4e4be" font-size="9.5">✓ Warning labels &amp; info</text>
    <text x="112" y="210" fill="#a4e4be" font-size="9.5">✓ Pleading &amp; persuasion</text>
    <text x="112" y="226" fill="#ff6a6a" font-size="9.5">✗ No coercive bans</text>
    <text x="112" y="239" fill="#ff6a6a" font-size="9">✗ No hard paternalism</text>

    <!-- Column 2: Public Offense -->
    <rect x="222" y="54" width="196" height="42" fill="#3a3418" stroke="#ffcf5a" stroke-width="3"/>
    <text x="320" y="73" fill="#ffcf5a" font-size="12.5" font-weight="bold">2 · Public Offense</text>
    <text x="320" y="88" fill="#ddcb9a" font-size="10">Feinberg's Standard</text>

    <rect x="222" y="102" width="196" height="52" fill="#202534" stroke="#ffcf5a" stroke-width="1.5"/>
    <text x="320" y="122" fill="#eef1ff" font-size="10.5">Funeral picketing, public</text>
    <text x="320" y="137" fill="#eef1ff" font-size="10.5">indecency, loud nuisance</text>

    <rect x="222" y="160" width="196" height="88" fill="#2d291e" stroke="#ffcf5a" stroke-width="2"/>
    <text x="320" y="179" fill="#ffcf5a" font-size="11" font-weight="bold">State Authority</text>
    <text x="320" y="196" fill="#ddcb9a" font-size="9.5">✓ Time, place, manner</text>
    <text x="320" y="210" fill="#ddcb9a" font-size="9.5">✓ Distance buffer zones</text>
    <text x="320" y="226" fill="#ff6a6a" font-size="9.5">✗ No viewpoint censorship</text>
    <text x="320" y="239" fill="#ff6a6a" font-size="9">✗ Offense alone is not harm</text>

    <!-- Column 3: Harm to Others -->
    <rect x="430" y="54" width="196" height="42" fill="#2a1a28" stroke="#ff6ad5" stroke-width="3"/>
    <text x="528" y="73" fill="#ff6ad5" font-size="12.5" font-weight="bold">3 · Harm to Others</text>
    <text x="528" y="88" fill="#dca5cf" font-size="10">The Harm Principle</text>

    <rect x="430" y="102" width="196" height="52" fill="#202534" stroke="#ff6ad5" stroke-width="1.5"/>
    <text x="528" y="122" fill="#eef1ff" font-size="10.5">Assault, toxic dumping,</text>
    <text x="528" y="137" fill="#eef1ff" font-size="10.5">contagion, reckless driving</text>

    <rect x="430" y="160" width="196" height="88" fill="#241b2a" stroke="#ff6ad5" stroke-width="2"/>
    <text x="528" y="179" fill="#ff6ad5" font-size="11" font-weight="bold">State Authority</text>
    <text x="528" y="196" fill="#dca5cf" font-size="9.5">✓ Criminal prosecution</text>
    <text x="528" y="210" fill="#dca5cf" font-size="9.5">✓ Quarantine &amp; safety rules</text>
    <text x="528" y="226" fill="#46e07a" font-size="9.5">✓ Legitimate legal coercion</text>
    <text x="528" y="239" fill="#a4e4be" font-size="9">To prevent harm to others</text>

  </g>
</svg>
