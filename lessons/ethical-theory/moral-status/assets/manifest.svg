<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" shape-rendering="crispEdges" role="img" aria-label="Six unfiled species dossiers stacked on a desk beside an empty status stamp and three sorting trays">
  <rect width="64" height="80" fill="#1d2235"/>
  <!-- desk -->
  <rect x="0" y="46" width="64" height="34" fill="#5a4426"/>
  <rect x="0" y="46" width="64" height="3" fill="#7a5e34"/>
  <!-- stack of six folders, fanned -->
  <rect x="6" y="14" width="34" height="6" fill="#c9a05a"/>
  <rect x="6" y="14" width="10" height="2" fill="#e0bd7c"/>
  <rect x="5" y="20" width="34" height="6" fill="#b78f4c"/>
  <rect x="5" y="20" width="10" height="2" fill="#d4ad6b"/>
  <rect x="7" y="26" width="34" height="6" fill="#c9a05a"/>
  <rect x="7" y="26" width="10" height="2" fill="#e0bd7c"/>
  <rect x="5" y="32" width="34" height="6" fill="#b78f4c"/>
  <rect x="5" y="32" width="10" height="2" fill="#d4ad6b"/>
  <rect x="6" y="38" width="34" height="6" fill="#c9a05a"/>
  <rect x="6" y="38" width="10" height="2" fill="#e0bd7c"/>
  <rect x="4" y="44" width="34" height="6" fill="#b78f4c"/>
  <rect x="4" y="44" width="10" height="2" fill="#d4ad6b"/>
  <!-- red UNFILED tabs -->
  <rect x="36" y="16" width="4" height="2" fill="#ff5d6c"/>
  <rect x="35" y="22" width="4" height="2" fill="#ff5d6c"/>
  <rect x="37" y="28" width="4" height="2" fill="#ff5d6c"/>
  <rect x="35" y="34" width="4" height="2" fill="#ff5d6c"/>
  <rect x="36" y="40" width="4" height="2" fill="#ff5d6c"/>
  <rect x="34" y="46" width="4" height="2" fill="#ff5d6c"/>
  <!-- the status stamp, inked and waiting -->
  <rect x="46" y="26" width="12" height="4" fill="#3a4468"/>
  <rect x="50" y="18" width="4" height="8" fill="#5a679a"/>
  <rect x="48" y="14" width="8" height="4" fill="#7c8ac0"/>
  <rect x="46" y="30" width="12" height="2" fill="#ff5d6c"/>
  <!-- three sorting trays: FULL / PARTIAL / NONE -->
  <rect x="42" y="54" width="18" height="5" fill="#050610"/>
  <rect x="43" y="55" width="16" height="3" fill="#46e07a"/>
  <rect x="42" y="61" width="18" height="5" fill="#050610"/>
  <rect x="43" y="62" width="16" height="3" fill="#ffcf5a"/>
  <rect x="42" y="68" width="18" height="5" fill="#050610"/>
  <rect x="43" y="69" width="16" height="3" fill="#ff5d6c"/>
  <!-- all three trays empty: nothing sorted yet -->
  <rect x="8" y="58" width="26" height="14" fill="#4a3720"/>
  <rect x="10" y="60" width="22" height="10" fill="#3a2b19"/>
  <rect x="12" y="63" width="12" height="1" fill="#9aa3c7"/>
  <rect x="12" y="66" width="16" height="1" fill="#9aa3c7"/>
</svg>
