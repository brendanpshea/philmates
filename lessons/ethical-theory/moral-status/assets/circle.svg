<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" shape-rendering="crispEdges" role="img" aria-label="The moral circle drawn as concentric rings, each wider ring adding more kinds of beings, the outermost ring still open">
  <rect width="64" height="80" fill="#1d2235"/>
  <!-- outermost ring: dashed, still being drawn -->
  <rect x="6" y="18" width="6" height="2" fill="#9aa3c7"/>
  <rect x="16" y="12" width="6" height="2" fill="#9aa3c7"/>
  <rect x="28" y="10" width="8" height="2" fill="#9aa3c7"/>
  <rect x="42" y="12" width="6" height="2" fill="#9aa3c7"/>
  <rect x="52" y="18" width="6" height="2" fill="#9aa3c7"/>
  <rect x="4" y="30" width="2" height="6" fill="#9aa3c7"/>
  <rect x="58" y="30" width="2" height="6" fill="#9aa3c7"/>
  <rect x="4" y="44" width="2" height="6" fill="#9aa3c7"/>
  <rect x="58" y="44" width="2" height="6" fill="#9aa3c7"/>
  <rect x="16" y="62" width="6" height="2" fill="#9aa3c7"/>
  <rect x="28" y="66" width="8" height="2" fill="#9aa3c7"/>
  <rect x="42" y="62" width="6" height="2" fill="#9aa3c7"/>
  <!-- ring 3 -->
  <rect x="12" y="22" width="40" height="2" fill="#4cc2ff"/>
  <rect x="12" y="54" width="40" height="2" fill="#4cc2ff"/>
  <rect x="10" y="24" width="2" height="30" fill="#4cc2ff"/>
  <rect x="52" y="24" width="2" height="30" fill="#4cc2ff"/>
  <!-- ring 2 -->
  <rect x="18" y="28" width="28" height="2" fill="#46e07a"/>
  <rect x="18" y="48" width="28" height="2" fill="#46e07a"/>
  <rect x="16" y="30" width="2" height="18" fill="#46e07a"/>
  <rect x="46" y="30" width="2" height="18" fill="#46e07a"/>
  <!-- innermost: the self / one's own kind -->
  <rect x="26" y="34" width="12" height="10" fill="#ff6ad5"/>
  <rect x="28" y="36" width="8" height="6" fill="#ffa3e6"/>
  <!-- inhabitants of each ring, as small marks -->
  <rect x="21" y="32" width="3" height="3" fill="#46e07a"/>
  <rect x="40" y="32" width="3" height="3" fill="#46e07a"/>
  <rect x="21" y="44" width="3" height="3" fill="#46e07a"/>
  <rect x="40" y="44" width="3" height="3" fill="#46e07a"/>
  <rect x="14" y="26" width="3" height="3" fill="#4cc2ff"/>
  <rect x="47" y="26" width="3" height="3" fill="#4cc2ff"/>
  <rect x="14" y="50" width="3" height="3" fill="#4cc2ff"/>
  <rect x="47" y="50" width="3" height="3" fill="#4cc2ff"/>
  <!-- creatures waiting outside the outermost ring -->
  <rect x="6" y="72" width="4" height="4" fill="#e08ab5"/>
  <rect x="16" y="72" width="4" height="4" fill="#7aa34e"/>
  <rect x="26" y="72" width="4" height="4" fill="#c49a56"/>
  <rect x="36" y="72" width="4" height="4" fill="#46e07a"/>
  <rect x="46" y="72" width="4" height="4" fill="#b7a48f"/>
  <rect x="56" y="72" width="4" height="4" fill="#e0a44e"/>
</svg>
