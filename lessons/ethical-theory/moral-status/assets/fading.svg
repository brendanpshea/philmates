<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" shape-rendering="crispEdges" role="img" aria-label="One of the Fading: an elder alien lying still in a warm-lit alcove, a book of their old poems open beside them, their mind-lamp gone dark">
  <rect width="64" height="80" fill="#1d2235"/>
  <!-- alcove wall -->
  <rect x="4" y="4" width="56" height="52" fill="#262c44"/>
  <rect x="4" y="4" width="56" height="2" fill="#3a4468"/>
  <!-- floor -->
  <rect x="0" y="66" width="64" height="14" fill="#20263c"/>
  <!-- bier / couch -->
  <rect x="6" y="52" width="52" height="14" fill="#3a4468"/>
  <rect x="6" y="52" width="52" height="2" fill="#5a679a"/>
  <rect x="8" y="66" width="4" height="6" fill="#2c3454"/>
  <rect x="52" y="66" width="4" height="6" fill="#2c3454"/>
  <!-- body under a blanket -->
  <rect x="12" y="46" width="40" height="6" fill="#6a5f8d"/>
  <rect x="14" y="44" width="34" height="2" fill="#7f74a6"/>
  <!-- head, eyes closed -->
  <rect x="14" y="36" width="12" height="10" fill="#b7a48f"/>
  <rect x="16" y="34" width="8" height="2" fill="#9c8b78"/>
  <rect x="16" y="40" width="8" height="1" fill="#5c5040"/>
  <!-- long ridged crest, elder marking -->
  <rect x="14" y="32" width="2" height="2" fill="#9aa3c7"/>
  <rect x="18" y="31" width="2" height="3" fill="#9aa3c7"/>
  <rect x="22" y="32" width="2" height="2" fill="#9aa3c7"/>
  <!-- mind-lamp above the bier: dark, unlit -->
  <rect x="42" y="14" width="10" height="10" fill="#050610"/>
  <rect x="44" y="16" width="6" height="6" fill="#2c3454"/>
  <rect x="46" y="10" width="2" height="4" fill="#3a4468"/>
  <!-- other lamps down the hall, still lit -->
  <rect x="10" y="14" width="7" height="7" fill="#050610"/>
  <rect x="11" y="15" width="5" height="5" fill="#ffcf5a"/>
  <rect x="26" y="14" width="7" height="7" fill="#050610"/>
  <rect x="27" y="15" width="5" height="5" fill="#ffcf5a"/>
  <!-- open book of poems on a stand -->
  <rect x="38" y="56" width="20" height="8" fill="#e6e0cf"/>
  <rect x="47" y="56" width="2" height="8" fill="#8d876f"/>
  <rect x="41" y="58" width="5" height="1" fill="#9aa3c7"/>
  <rect x="41" y="60" width="5" height="1" fill="#9aa3c7"/>
  <rect x="50" y="58" width="5" height="1" fill="#9aa3c7"/>
  <rect x="50" y="60" width="5" height="1" fill="#9aa3c7"/>
  <!-- dust motes -->
  <rect x="34" y="28" width="1" height="1" fill="#9aa3c7" opacity="0.7"/>
  <rect x="40" y="36" width="1" height="1" fill="#9aa3c7" opacity="0.7"/>
  <rect x="30" y="42" width="1" height="1" fill="#9aa3c7" opacity="0.7"/>
  <!-- steady vitals: heart still beating -->
  <rect x="4" y="70" width="22" height="8" fill="#050610"/>
  <rect x="6" y="72" width="18" height="4" fill="#11131f"/>
  <rect x="7" y="74" width="4" height="1" fill="#46e07a"/>
  <rect x="11" y="72" width="1" height="4" fill="#46e07a"/>
  <rect x="12" y="74" width="4" height="1" fill="#46e07a"/>
  <rect x="16" y="72" width="1" height="4" fill="#46e07a"/>
  <rect x="17" y="74" width="6" height="1" fill="#46e07a"/>
</svg>
