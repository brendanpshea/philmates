<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" shape-rendering="crispEdges" role="img" aria-label="Diagram: one wide green bar labelled THE INTERNET, packet delivery, 1969, with three separate boxes resting on top of it — EMAIL from 1971, THE WEB from 1989, and VIDEO CALL. The web is one of several things built on the internet, not the internet itself.">
  <rect width="640" height="230" fill="#1a1f31"/>

  <!-- three things built on top, drawn as siblings -->
  <g font-family="Verdana, DejaVu Sans, sans-serif" text-anchor="middle">
    <rect x="28"  y="26" width="176" height="66" fill="#2a2140" stroke="#ff6ad5" stroke-width="3"/>
    <text x="116" y="56" fill="#ff6ad5" font-size="18" font-weight="bold">EMAIL</text>
    <text x="116" y="78" fill="#c9b6d8" font-size="15">1971</text>

    <rect x="232" y="26" width="176" height="66" fill="#20304a" stroke="#4cc2ff" stroke-width="3"/>
    <text x="320" y="56" fill="#4cc2ff" font-size="18" font-weight="bold">THE WEB</text>
    <text x="320" y="78" fill="#a8c4dd" font-size="15">1989</text>

    <rect x="436" y="26" width="176" height="66" fill="#3a3418" stroke="#ffcf5a" stroke-width="3"/>
    <text x="524" y="56" fill="#ffcf5a" font-size="18" font-weight="bold">VIDEO CALL</text>
    <text x="524" y="78" fill="#ddcb9a" font-size="15">later still</text>
  </g>

  <!-- each sits on the layer below -->
  <g stroke="#9aa3c7" stroke-width="3">
    <path d="M116 92 L116 128"/>
    <path d="M320 92 L320 128"/>
    <path d="M524 92 L524 128"/>
  </g>

  <!-- the layer that carries all of them -->
  <rect x="28" y="128" width="584" height="74" fill="#133a24" stroke="#46e07a" stroke-width="3"/>
  <g font-family="Verdana, DejaVu Sans, sans-serif" text-anchor="middle">
    <text x="320" y="160" fill="#46e07a" font-size="19" font-weight="bold">THE INTERNET</text>
    <text x="320" y="184" fill="#8fd9a8" font-size="15">moves packets between machines · 1969</text>
  </g>

  <!-- packets riding the bottom layer -->
  <g fill="#46e07a">
    <rect x="60"  y="196" width="12" height="10"/>
    <rect x="92"  y="196" width="12" height="10"/>
    <rect x="124" y="196" width="12" height="10"/>
    <rect x="516" y="196" width="12" height="10"/>
    <rect x="548" y="196" width="12" height="10"/>
  </g>
</svg>
