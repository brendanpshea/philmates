<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" shape-rendering="crispEdges" role="img" aria-label="Diagram in two steps. Step one: your machine asks the name system for dragon-donuts.example and gets back the number 203.0.113.42. Step two: a packet addressed to that number crosses four routers. The direct route through the third router is broken, so the packet detours around it through a lower router and still arrives.">
  <rect width="640" height="300" fill="#1a1f31"/>
  <g font-family="Verdana, DejaVu Sans, sans-serif">

    <!-- ============ step 1: name to number ============ -->
    <text x="16" y="26" fill="#ffcf5a" font-size="15" font-weight="bold">1 · LOOK UP THE NAME</text>

    <rect x="16" y="38" width="184" height="52" fill="#232838" stroke="#cdd3e8" stroke-width="3"/>
    <text x="108" y="60" fill="#eef1ff" font-size="15" text-anchor="middle">you type</text>
    <text x="108" y="80" fill="#46e07a" font-size="14" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">dragon-donuts.example</text>

    <path d="M200 64 L246 64" stroke="#9aa3c7" stroke-width="3"/>
    <path d="M240 58 L252 64 L240 70 Z" fill="#9aa3c7"/>

    <rect x="252" y="38" width="136" height="52" fill="#3a3418" stroke="#ffcf5a" stroke-width="3"/>
    <text x="320" y="60" fill="#ffcf5a" font-size="15" text-anchor="middle" font-weight="bold">name system</text>
    <text x="320" y="80" fill="#ddcb9a" font-size="14" text-anchor="middle">what number?</text>

    <path d="M388 64 L434 64" stroke="#9aa3c7" stroke-width="3"/>
    <path d="M428 58 L440 64 L428 70 Z" fill="#9aa3c7"/>

    <rect x="440" y="38" width="184" height="52" fill="#20304a" stroke="#4cc2ff" stroke-width="3"/>
    <text x="532" y="60" fill="#4cc2ff" font-size="15" text-anchor="middle">the machine is at</text>
    <text x="532" y="80" fill="#4cc2ff" font-size="16" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">203.0.113.42</text>

    <!-- ============ step 2: routing to that number ============ -->
    <text x="16" y="130" fill="#ffcf5a" font-size="15" font-weight="bold">2 · SEND A PACKET TO THAT NUMBER</text>

    <!-- sender -->
    <rect x="16" y="150" width="86" height="46" fill="#232838" stroke="#cdd3e8" stroke-width="3"/>
    <text x="59" y="178" fill="#eef1ff" font-size="15" text-anchor="middle">you</text>

    <!-- routers -->
    <g>
      <rect x="150" y="150" width="60" height="46" fill="#232838" stroke="#46e07a" stroke-width="3"/>
      <text x="180" y="178" fill="#46e07a" font-size="15" text-anchor="middle">R1</text>

      <rect x="272" y="150" width="60" height="46" fill="#232838" stroke="#46e07a" stroke-width="3"/>
      <text x="302" y="178" fill="#46e07a" font-size="15" text-anchor="middle">R2</text>

      <!-- the broken one -->
      <rect x="394" y="150" width="60" height="46" fill="#2a1a24" stroke="#ff6ad5" stroke-width="3" opacity="0.5"/>
      <text x="424" y="178" fill="#ff6ad5" font-size="15" text-anchor="middle" opacity="0.6">R3</text>
      <g stroke="#ff6ad5" stroke-width="4">
        <path d="M406 160 L442 186"/>
        <path d="M442 160 L406 186"/>
      </g>

      <!-- the detour -->
      <rect x="360" y="230" width="124" height="46" fill="#232838" stroke="#46e07a" stroke-width="3"/>
      <text x="422" y="258" fill="#46e07a" font-size="15" text-anchor="middle">R4 · detour</text>
    </g>

    <!-- destination -->
    <rect x="516" y="150" width="108" height="46" fill="#20304a" stroke="#4cc2ff" stroke-width="3"/>
    <text x="570" y="171" fill="#4cc2ff" font-size="14" text-anchor="middle">the shop</text>
    <text x="570" y="188" fill="#4cc2ff" font-size="13" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">203.0.113.42</text>

    <!-- the path actually taken -->
    <g stroke="#46e07a" stroke-width="3" fill="none">
      <path d="M102 173 L144 173"/>
      <path d="M210 173 L266 173"/>
      <path d="M302 196 L302 253 L360 253"/>
      <path d="M484 253 L570 253 L570 196"/>
    </g>
    <path d="M564 208 L570 196 L576 208 Z" fill="#46e07a"/>

    <!-- the path that failed -->
    <path d="M332 173 L388 173" stroke="#ff6ad5" stroke-width="3" stroke-dasharray="7 6" fill="none"/>

    <text x="16" y="296" fill="#cdd3e8" font-size="14">No router knows the whole route. Each one only knows which neighbor is a step closer.</text>
  </g>
</svg>
