<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 108" shape-rendering="crispEdges" role="img" aria-label="Relic card: a heavy amber-framed broadcast screen whose thick bezel dwarfs the tiny grey picture inside, radiating transmission arcs, above a long information bar and a stub of an action bar">
  <!-- card frame -->
  <rect width="80" height="108" fill="#050610"/>
  <rect x="2" y="2" width="76" height="104" fill="#ffb648"/>
  <rect x="4" y="4" width="72" height="100" fill="#1d2235"/>
  <!-- title bar + rank gem -->
  <rect x="7" y="7" width="66" height="12" fill="#262c44"/>
  <polygon points="40,8 45,13 40,18 35,13" fill="#ffb648"/>
  <!-- bottom plate + rarity pips -->
  <rect x="7" y="89" width="66" height="12" fill="#262c44"/>
  <rect x="32" y="93" width="4" height="4" fill="#ffb648"/>
  <rect x="38" y="93" width="4" height="4" fill="#ffb648"/>
  <rect x="44" y="93" width="4" height="4" fill="#ffb648"/>

  <!-- transmission arcs (the medium, broadcasting) -->
  <rect x="38" y="22" width="4" height="4" fill="#ffb648"/>
  <rect x="30" y="24" width="3" height="3" fill="#8a6428"/>
  <rect x="47" y="24" width="3" height="3" fill="#8a6428"/>
  <rect x="23" y="27" width="3" height="3" fill="#5c431b"/>
  <rect x="54" y="27" width="3" height="3" fill="#5c431b"/>

  <!-- the screen: a massive bezel (THE MEDIUM) ... -->
  <rect x="16" y="32" width="48" height="34" fill="#ffb648"/>
  <rect x="19" y="35" width="42" height="28" fill="#c98a2e"/>
  <!-- ... wrapped around a tiny dim picture (the message) -->
  <rect x="30" y="42" width="20" height="14" fill="#11131f"/>
  <rect x="36" y="47" width="8" height="4" fill="#6b7290"/>

  <!-- stand -->
  <rect x="36" y="66" width="8" height="4" fill="#8a6428"/>
  <rect x="28" y="70" width="24" height="3" fill="#8a6428"/>

  <!-- information-to-action ratio: a long bar of information ... -->
  <rect x="14" y="77" width="52" height="4" fill="#ffb648"/>
  <!-- ... over a stub of action -->
  <rect x="14" y="83" width="7" height="4" fill="#ff5d6c"/>
</svg>
